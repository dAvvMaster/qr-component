<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A simple QR code component for generating QR codes.">
        <title>QR Code Component</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <main class="qr-container">
            <div class="qr-box">
                <img src="image-qr-code.png" alt="QR code linking to Frontend Mentor" class="qr-image"/>
                <h1 class="qr-title">Improve your front-end skills by building projects</h1>
                <p class="qr-description">Scan the QR code to visit Frontend Mentor and  take your coding skills to the next level</p>
            </div>
        </main>
    </body>
</html>
